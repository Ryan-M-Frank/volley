name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux (linux/macos)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y tmux; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install tmux || true; fi
      - name: Run bash test suite
        shell: bash
        run: bash tests/run-all.sh
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint all bash
        run: shellcheck -S warning scripts/*.sh scripts/platforms/*.sh tests/*.sh
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No RASA / secret bleed-through
        run: |
          if grep -rniE 'rasa|RASA_DEMO|/c/git/RASA|api[_-]?key|secret[_-]?key|ghp_[A-Za-z0-9]{20}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY' . --exclude-dir=.git --exclude-dir=workflows | grep -viE 'frank\.ryanm@gmail\.com'; then
            echo "::error::Potential RASA/secret bleed-through found above - must be zero before publish."
            exit 1
          fi
          echo "leak scan clean"
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests parse as JSON
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/plugin.json')); json.load(open('.claude-plugin/marketplace.json')); json.load(open('.mcp.json')); print('manifests valid JSON')"
